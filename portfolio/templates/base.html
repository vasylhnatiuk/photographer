<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% load static %}
<link rel="icon" href="{% static 'images/icon2.png' %}" type="image/x-icon">
  <title>{% block title %}Vasyl Hnatiuk — Photographer{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      margin: 0;
      background: #fff;
      color: #111;
    }

    /* ── HEADER ── */
    #site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 100%);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    #desktop-nav a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: .03em;
      transition: color .2s;
    }
    #desktop-nav a:hover { color: #fff; }

    #menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    #menu-btn span {
      width: 26px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    /* ── MOBILE MENU ── */
    #mobile-menu {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;

      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    #mobile-menu.open {
      opacity: 1;
      pointer-events: all;
    }

    #mobile-menu a {
      color: rgba(255,255,255,.88);
      text-decoration: none;
      font-size: 1.75rem;
    }

    #close-menu {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ── HEADER ── -->
<header id="site-header">

  <!-- LOGO -->
  <a href="/" class="logo">vas.photo.nyc</a>

  <!-- NAV -->
  <nav
    id="desktop-nav"
    class="hidden lg:flex items-center gap-10 absolute left-1/2 -translate-x-1/2"
  >
    <a href="/">Home</a>
    <a href="/#portfolio">Portfolio</a>
    <a href="/#aboutme">About me</a>
<!--    <a href="https://instagram.com/vas.photo.nyc"></a>-->
    <a href="/booking/">Booking & Prices</a>
  </nav>

  <!-- MOBILE BUTTON -->
  <button id="menu-btn" class="lg:hidden">
    <span></span><span></span><span></span>
  </button>

</header>

<!-- ── MOBILE MENU ── -->
<div id="mobile-menu">
  <button id="close-menu">✕</button>

  <a href="/">Home</a>
  <a href="/#portfolio">Portfolio</a>
  <a href="https://instagram.com/vas.photo.nyc">Booking</a>
  <a href="/#aboutme">About me</a>
  <a href="/booking/">Booking & Prices</a>
</div>

<!-- ── CONTENT ── -->
<main>
  {% block content %}{% endblock %}
</main>

<!-- ── SCRIPT ── -->
<script>
  const menu = document.getElementById('mobile-menu');
  const openBtn = document.getElementById('menu-btn');
  const closeBtn = document.getElementById('close-menu');

  openBtn.addEventListener('click', () => {
    menu.classList.add('open');
    document.body.style.overflow = 'hidden';
  });

  closeBtn.addEventListener('click', () => {
    menu.classList.remove('open');
    document.body.style.overflow = '';
  });

  menu.querySelectorAll('a').forEach(a =>
    a.addEventListener('click', () => {
      menu.classList.remove('open');
      document.body.style.overflow = '';
    })
  );
</script>

<!-- ── FIXED CTA ── -->
<section class="fixed bottom-6 left-0 w-full z-50 pointer-events-none">

  <div class="max-w-6xl mx-auto px-4">

    <div class="pointer-events-auto
                backdrop-blur-2xl
                bg-black/40
                border border-white/10
                rounded-full px-7 py-5
                flex items-center justify-between
                shadow-[0_12px_50px_rgba(0,0,0,0.45)]">

      <h2 class="text-white font-light text-lg md:text-2xl hidden lg:block">
        Let’s create something timeless
      </h2>

      <div class="flex items-center gap-4">

        <span class="text-white/70 text-sm md:text-base">
          Book here →
        </span>

        <a href="https://instagram.com/vas.photo.nyc"
           class="p-3 rounded-full bg-white/10 hover:bg-white/20 text-white">
          IG
        </a>

        <a href="https://t.me/reallyops"
           class="p-3 rounded-full bg-white/10 hover:bg-white/20 text-white">
          TG
        </a>

        <a href="mailto:vasylhnatiukjob@gmail.com"
           class="p-3 rounded-full bg-white/10 hover:bg-white/20 text-white">
          @
        </a>

      </div>

    </div>

  </div>

</section>

</body>
</html>
