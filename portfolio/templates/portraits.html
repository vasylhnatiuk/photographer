{% extends "base.html" %}
{% load static %}

{% block title %}Portraits{% endblock %}

{% block content %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap');

  .fade-up {
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp 1s ease forwards;
  }

  .fade-delay-1 { animation-delay: 0.2s; }
  .fade-delay-2 { animation-delay: 0.4s; }
  .fade-delay-3 { animation-delay: 0.6s; }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
  }

  .hero-sub {
    font-family: 'Montserrat', sans-serif;
    letter-spacing: 0.12em;
  }
</style>

<!-- HERO -->
<section class="relative w-full h-[40vh] md:h-[55vh] overflow-hidden">

  <img src="{% static 'images/portraits.jpg' %}"
       class="absolute inset-0 w-full h-full object-cover">

  <div class="absolute inset-0 bg-black/70"></div>

  <div class="relative z-10 h-full flex flex-col items-center justify-end pb-14 text-center px-6">

    <h1 class="hero-title text-white font-light text-3xl md:text-5xl fade-up fade-delay-1">
      Portraits
    </h1>

    <p class="hero-sub text-white/70 mt-3 text-sm md:text-lg fade-up fade-delay-2">
      Real moments • Cinematic mood • Different lights
    </p>

  </div>

</section>

<!-- GRID -->
<section class="max-w-6xl mx-auto px-4 py-16 space-y-10">

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">

    <div onclick="openLightbox(0)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p1.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

    <div onclick="openLightbox(1)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p2.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

    <div onclick="openLightbox(2)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p3.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

  </div>

  <!-- BIG -->
  <div onclick="openLightbox(3)" class="cursor-pointer overflow-hidden group relative">

    <img src="{% static 'images/p4.jpg' %}"
         class="h-[400px] md:h-[600px] w-full object-cover group-hover:scale-105 transition duration-700">

    <div class="absolute bottom-10 left-10 text-white max-w-xl">

      <p class="text-xs tracking-[0.3em] uppercase text-white/60 fade-up fade-delay-1">
        Emotional portrait
      </p>

      <h2 class="text-3xl md:text-5xl font-light mt-3 fade-up fade-delay-2 hero-title">
        Light defines emotion
      </h2>


    </div>

  </div>

  <!-- ROW 2 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div onclick="openLightbox(4)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p5.jpg' %}" class="h-[400px] md:h-[450px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

    <div onclick="openLightbox(5)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p6.jpg' %}" class="h-[400px] md:h-[450px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

  </div>

  <!-- BIG -->
  <div onclick="openLightbox(6)" class="cursor-pointer overflow-hidden group relative">

    <img src="{% static 'images/p7.jpg' %}"
         class="h-[400px] md:h-[600px] w-full object-cover group-hover:scale-105 transition duration-700">

    <div class="absolute bottom-10 left-10 text-white max-w-xl">

      <p class="text-xs tracking-[0.3em] uppercase text-white/60 fade-up fade-delay-1">
        Selected frame
      </p>

      <h2 class="text-2xl md:text-4xl font-light mt-2 fade-up fade-delay-2 hero-title">
        Silence between emotions
      </h2>

    </div>

  </div>

  <!-- ROW 3 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">

    <div onclick="openLightbox(7)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p8.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

    <div onclick="openLightbox(8)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p9.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

    <div onclick="openLightbox(9)" class="cursor-pointer overflow-hidden group">
      <img src="{% static 'images/p10.jpg' %}" class="h-[400px] w-full object-cover group-hover:scale-105 transition duration-700">
    </div>

  </div>

</section>

<!-- LIGHTBOX -->
<div id="lightbox"
     class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center">

  <img id="lightbox-img"
       class="max-w-[92%] max-h-[85%] object-contain">

  <button onclick="prevImage()"
          class="absolute left-6 text-white text-9xl md:text-[10rem] leading-none opacity-80 hover:opacity-100 transition">
    ‹
  </button>

  <button onclick="nextImage()"
          class="absolute right-6 text-white text-9xl md:text-[10rem] leading-none opacity-80 hover:opacity-100 transition">
    ›
  </button>

</div>

<script>
const images = [
  "{% static 'images/p1.jpg' %}",
  "{% static 'images/p2.jpg' %}",
  "{% static 'images/p3.jpg' %}",
  "{% static 'images/p4.jpg' %}",
  "{% static 'images/p5.jpg' %}",
  "{% static 'images/p6.jpg' %}",
  "{% static 'images/p7.jpg' %}",
  "{% static 'images/p8.jpg' %}",
  "{% static 'images/p9.jpg' %}",
  "{% static 'images/p10.jpg' %}"
];

let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const img = document.getElementById('lightbox-img');

function openLightbox(i) {
  currentIndex = i;
  img.src = images[i];
  lightbox.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.add('hidden');
  document.body.style.overflow = '';
}

function show(i) {
  if (i < 0) i = images.length - 1;
  if (i >= images.length) i = 0;
  currentIndex = i;
  img.src = images[i];
}

function nextImage() { show(currentIndex + 1); }
function prevImage() { show(currentIndex - 1); }

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') nextImage();
  if (e.key === 'ArrowLeft') prevImage();
});

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
</script>

{% endblock %}
