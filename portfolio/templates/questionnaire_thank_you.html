<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Vas Photo NYC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f3ec;
            color: #292621;
            font-family: "Montserrat", sans-serif;
        }

        .thank-you {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .thank-you-inner {
            max-width: 650px;
        }

        .eyebrow {
            margin-bottom: 20px;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #9a835f;
        }

        h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(55px, 9vw, 90px);
            font-weight: 400;
            line-height: .95;
        }

        p {
            margin: 28px auto 0;
            max-width: 500px;
            font-size: 13px;
            line-height: 1.9;
            font-weight: 300;
            color: #716a62;
        }

        .home-link {
            display: inline-block;
            margin-top: 38px;
            padding: 17px 35px;
            border: 1px solid #8f7854;
            color: #705d42;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: .3s ease;
        }

        .home-link:hover {
            background: #8f7854;
            color: #fff;
        }
    </style>

    <script>
        setTimeout(function () {
            window.location.href = "/";
        }, 3000);
    </script>
</head>

<body>

    <main class="thank-you">

        <div class="thank-you-inner">

            <div class="eyebrow">
                Vas Photo NYC
            </div>

            <h1>
                Thank you.
            </h1>

            <p>
                Thank you for taking the time to fill out the questionnaire.
                I’ve received your answers and will get back to you soon.
            </p>

            <a href="/" class="home-link">
                Back to home
            </a>

        </div>

    </main>

</body>
</html>
